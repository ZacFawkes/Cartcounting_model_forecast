stages:
  - build

variables:
  IMAGE: $CI_REGISTRY_IMAGE/cart-platform
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "/certs/client"
  DOCKER_BUILDKIT: "1"

.docker:
  tags:
    - microservices
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  before_script:
    - until docker info >/dev/null 2>&1; do sleep 1; done
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

build-push:
  extends: .docker
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    BUILD_NUMBER: $CI_PIPELINE_IID
  script:
    - echo "Registry   $CI_REGISTRY"
    - echo "Image      $IMAGE"
    - echo "Build      $BUILD_NUMBER ($CI_COMMIT_REF_NAME @ $CI_COMMIT_SHORT_SHA)"
    - echo "Will push  $IMAGE:$BUILD_NUMBER"
    - if [ -n "$CI_COMMIT_TAG" ]; then echo "Will push  $IMAGE:$CI_COMMIT_TAG"; fi
    - >
      docker build
      --file cart_platform/Dockerfile
      --label org.opencontainers.image.version=$BUILD_NUMBER
      --label org.opencontainers.image.revision=$CI_COMMIT_SHA
      --label org.opencontainers.image.source=$CI_PROJECT_URL
      --tag "$IMAGE:$BUILD_NUMBER"
      .
    - docker push "$IMAGE:$BUILD_NUMBER"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$IMAGE:$BUILD_NUMBER" "$IMAGE:$CI_COMMIT_TAG"
        docker push "$IMAGE:$CI_COMMIT_TAG"
        echo "Pushed     $IMAGE:$CI_COMMIT_TAG"
      fi
    - echo "Pushed     $IMAGE:$BUILD_NUMBER"
    - echo "Digest     $(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$BUILD_NUMBER")"
    - echo "Deploy     CART_TAG=$BUILD_NUMBER docker compose -f docker-compose.deploy.yml up -d"
    - echo "Registry UI $CI_PROJECT_URL/container_registry"
